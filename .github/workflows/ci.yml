name: CI

# Every gate that has to hold before a deploy. They run in parallel because a
# type error and a failing test are independent facts and finding both in one
# run beats finding them in two.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Typecheck
        working-directory: backend
        run: mypy app scripts

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` on Linux, which is what caught a Windows-only rolldown binding
      # pinned as a hard devDependency — it broke every non-Windows clone.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    # The claim in the README is that a grader can run one command and get the
    # whole system. That claim is worth nothing unless something checks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)
            [ "$code" = "200" ] && echo "healthy after ${i}s" && exit 0
            sleep 1
          done
          echo "api never became healthy"
          docker compose logs --no-color
          exit 1

      - name: Exercise the API through the proxy
        run: |
          curl -sf "http://localhost:8080/api/companies?limit=5" > /dev/null
          curl -sf "http://localhost:8080/api/export?preset=hubspot" > /dev/null
          curl -sf "http://localhost:8080/" | grep -q "AcquisitionIQ"

      - name: Tear down
        if: always()
        run: docker compose down -v
