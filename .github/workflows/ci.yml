name: CI

# Every gate that has to hold before a deploy. They run in parallel because a
# type error and a failing test are independent facts and finding both in one
# run beats finding them in two.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # A real Postgres, because the storage tests are the ones that prove the SQL
    # path returns what the in-memory path does. They skip without a database,
    # which is right on a laptop and would be a silent hole here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiq
          POSTGRES_PASSWORD: aiq
          POSTGRES_DB: aiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiq -d aiq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aiq:aiq@localhost:5432/aiq
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Typecheck
        working-directory: backend
        run: mypy app scripts

      # -rs lists every skipped test with its reason, so a storage test that
      # quietly stopped running shows up in the log instead of in production.
      - name: Test
        working-directory: backend
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` on Linux, which is what caught a Windows-only rolldown binding
      # pinned as a hard devDependency — it broke every non-Windows clone.
      - name: Install
        working-directory: frontend
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`. The root tsconfig is solution-style
      # (`"files": []` plus references), so plain `tsc --noEmit` compiles zero
      # files and passes no matter what is in the source — this step sat green
      # over a deliberate `const x: number = "string"` until it was checked.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --force

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The scoring rule is implemented twice, in Python and in TypeScript, and
      # a generated fixture is what keeps them honest. That guard only means
      # something if it runs here as well as on the machine that wrote it.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    # The claim in the README is that one command brings up the whole system.
    # That claim is worth nothing unless something checks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)
            [ "$code" = "200" ] && echo "healthy after ${i}s" && exit 0
            sleep 1
          done
          echo "api never became healthy"
          docker compose logs --no-color
          exit 1

      # Compose runs with a database, so the API must be serving from it: the
      # schema migrated, the snapshot loaded, reads going through SQL. A green
      # health check alone would not show that, since the snapshot fallback is
      # healthy too.
      - name: The API is serving from Postgres, not the fallback
        run: |
          health=$(curl -sf http://localhost:8080/api/health)
          echo "$health"
          echo "$health" | grep -q '"storage":"postgres"'
          echo "$health" | grep -q '"database":"ok"'

      - name: Exercise the API through the proxy
        run: |
          curl -sf "http://localhost:8080/api/companies?limit=5" > /dev/null
          curl -sf "http://localhost:8080/api/export?preset=hubspot" > /dev/null
          curl -sf "http://localhost:8080/" | grep -q "AcquisitionIQ"

      - name: Tear down
        if: always()
        run: docker compose down -v
