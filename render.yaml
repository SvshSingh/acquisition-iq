# Backend as a long-running container, deliberately not serverless. Scrape jobs
# behind "refresh from source" outlast a serverless timeout, and the connection
# pool and parsed dataset are only worth having if the process survives between
# requests. See ARCHITECTURE.md.

services:
  - type: web
    name: acquisition-iq-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Only used if the frontend ever calls the API cross-origin. In the
      # shipped setup it does not — Vercel rewrites /api server-side, so requests
      # reach here same-origin and never trigger CORS. Set to the real Vercel
      # deployment so a direct browser call would still work; update it if the
      # frontend URL changes.
      - key: CORS_ORIGINS
        value: https://frontend-orcin-five-88.vercel.app
      # The Supabase connection string. `sync: false` means the value is set in
      # the Render dashboard and never lives in this file or in git.
      #
      # Use the *Session pooler* string (host ...pooler.supabase.com, port 5432).
      # Supabase's direct connection is IPv6-only and Render's network is IPv4,
      # so the direct string resolves and then cannot connect; the pooler is the
      # IPv4 path. The transaction pooler (port 6543) also works — the app
      # detects it and disables prepared-statement caching — but the session
      # pooler suits a long-running container with its own pool.
      #
      # Left unset, the service runs from the committed snapshot and
      # /api/health reports `"database": "not configured"`.
      - key: DATABASE_URL
        sync: false
      # Unset on the free tier: the HTTP cache uses its Postgres table when a
      # database is configured, and runs uncached when one is not.
      - key: REDIS_URL
        value: ""
