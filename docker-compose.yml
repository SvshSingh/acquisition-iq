# One command for the whole system:
#
#     docker compose up --build
#
# then open http://localhost:8080
#
# Postgres is the serving path here. On first start the API migrates the schema
# and loads the committed snapshot into the empty database; after that every
# search is a SQL query and every "refresh from source" is written back.
# `curl localhost:8000/api/health` reports `"storage": "postgres"`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiq
      POSTGRES_PASSWORD: aiq
      POSTGRES_DB: aiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiq -d aiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://aiq:aiq@db:5432/aiq
      # No REDIS_URL: the HTTP cache uses its Postgres table. See ARCHITECTURE.md.
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
